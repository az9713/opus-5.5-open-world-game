<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Felt World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #3f6f6c; --felt-dark: #2c4f4d; --cream: #f1e6cf; --oat: #d9c9a8; --mustard: #d4a636;
    --rose: #d49a9a; --terra: #c46a4a; --thread: #5a3e36; --ink: #3b2e2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2c4f4d; font-family: 'Patrick Hand', 'Fredoka', sans-serif; color: var(--ink); user-select: none; }
  canvas#c { display: block; width: 100vw; height: 100vh; }
  .patch {
    background: var(--cream); border-radius: 14px; padding: 8px 12px;
    box-shadow: 0 3px 0 rgba(60,40,30,.35), 0 0 0 4px var(--cream);
    outline: 2px dashed var(--thread); outline-offset: -6px;
  }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #hud .patch { pointer-events: auto; }
  #tl { position: absolute; left: 30px; top: 28px; }
  #clock { font-family: 'Fredoka'; font-weight: 700; font-size: 26px; letter-spacing: 1px; }
  #times { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; max-width: 300px; }
  #times button, .btn {
    font-family: 'Patrick Hand'; font-size: 15px; border: 2px dashed var(--thread); border-radius: 999px;
    background: var(--oat); color: var(--ink); padding: 1px 9px; cursor: pointer;
  }
  #times button.on { background: var(--mustard); }
  #tr { position: absolute; right: 30px; top: 28px; text-align: right; font-size: 18px; line-height: 1.25; }
  #tr b { font-family: 'Fredoka'; font-size: 20px; }
  #bl { position: absolute; left: 30px; bottom: 28px; min-width: 210px; }
  #mode { font-family: 'Fredoka'; font-weight: 700; font-size: 22px; color: var(--terra); }
  #speed { font-family: 'Fredoka'; font-size: 34px; font-weight: 600; line-height: 1; }
  #speed small { font-size: 14px; }
  #radio { font-size: 15px; margin-top: 4px; }
  #hint { font-size: 15px; color: #6d5a50; margin-top: 2px; }
  #mm { position: absolute; right: 30px; bottom: 28px; padding: 6px; }
  #mm canvas { display: block; border-radius: 50%; width: 170px; height: 170px; }
  #help { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); display: none; max-width: 560px; font-size: 18px; }
  #toast { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-family: 'Fredoka'; font-size: 26px; color: var(--cream);
           text-shadow: 0 2px 0 var(--thread), 0 0 8px rgba(0,0,0,.4); opacity: 0; transition: opacity .4s; white-space: nowrap; }
  #intro { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(44,79,77,.55); }
  #intro .patch { max-width: 620px; padding: 26px 34px; text-align: center; }
  #intro h1 { font-family: 'Fredoka'; font-weight: 700; font-size: 64px; margin: 0; color: var(--terra); letter-spacing: 2px; text-shadow: 0 3px 0 var(--mustard); }
  #intro p { font-size: 20px; margin: 8px 0 14px; }
  .keys { display: grid; grid-template-columns: auto auto; gap: 2px 18px; text-align: left; font-size: 17px; margin: 0 auto 18px; width: max-content; }
  .keys b { font-family: 'Fredoka'; color: var(--felt-dark); }
  #start { font-family: 'Fredoka'; font-size: 26px; font-weight: 600; padding: 8px 34px; background: var(--mustard); border: 3px dashed var(--thread); border-radius: 999px; cursor: pointer; color: var(--ink); }
  #quality { margin-top: 12px; font-size: 16px; }
  /* ---- touch devices ---- */
  html, body { overscroll-behavior: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas#c { touch-action: none; }
  #touch, #rotate { display: none; }
  body.touch { position: fixed; inset: 0; touch-action: none; }
  body.touch.playing #touch { display: block; }
  body.touch #times, body.touch #hint, body.touch #radio { display: none; }
  body.touch #tl { left: calc(env(safe-area-inset-left) + 12px); top: calc(env(safe-area-inset-top) + 10px); padding: 4px 10px; }
  body.touch #clock { font-size: 18px; cursor: pointer; }
  body.touch #bl { left: 50%; top: calc(env(safe-area-inset-top) + 10px); bottom: auto; transform: translateX(-50%); min-width: 0; padding: 4px 12px; text-align: center; }
  body.touch #mode { font-size: 14px; display: inline; }
  body.touch #speed { font-size: 16px; display: inline; margin-left: 6px; }
  body.touch #speed small { font-size: 11px; }
  body.touch #tr { right: calc(env(safe-area-inset-right) + 118px); top: calc(env(safe-area-inset-top) + 10px); font-size: 13px; line-height: 1.1; padding: 4px 10px; }
  body.touch #tr b { font-size: 14px; }
  body.touch #mm { right: calc(env(safe-area-inset-right) + 12px); top: calc(env(safe-area-inset-top) + 10px); bottom: auto; padding: 4px; }
  body.touch #mm canvas { width: 92px; height: 92px; }
  body.touch #help { font-size: 14px; max-height: 90vh; overflow-y: auto; touch-action: pan-y; }
  body.touch #toast { font-size: 18px; top: 26%; }
  #stick { position: fixed; left: calc(env(safe-area-inset-left) + 22px); bottom: calc(env(safe-area-inset-bottom) + 22px); width: 132px; height: 132px; border-radius: 50%;
           background: rgba(241,230,207,.28); border: 3px dashed rgba(241,230,207,.85); touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: var(--mustard);
          border: 3px dashed var(--thread); box-shadow: 0 2px 0 rgba(60,40,30,.35); pointer-events: none; }
  #tbtns { position: fixed; right: calc(env(safe-area-inset-right) + 16px); bottom: calc(env(safe-area-inset-bottom) + 18px); display: flex; flex-wrap: wrap-reverse;
           flex-direction: row-reverse; gap: 8px; width: 250px; }
  #tbtns button { width: 56px; height: 56px; border-radius: 50%; border: 3px dashed var(--thread); background: var(--cream); color: var(--ink); touch-action: none;
                  font-family: 'Fredoka'; font-weight: 600; font-size: 11px; line-height: 1.05; padding: 0; box-shadow: 0 2px 0 rgba(60,40,30,.35); }
  #tbtns button.down { background: var(--mustard); }
  #tbtns button[hidden] { display: none; }
  #rotate { position: fixed; inset: 0; z-index: 50; background: #2c4f4d; color: var(--cream); font-family: 'Fredoka'; font-size: 24px;
            align-items: center; justify-content: center; text-align: center; padding: 30px; }
  @media (orientation: portrait) { body.touch #rotate { display: flex; } }
  @media (max-height: 460px) {
    #intro .patch { padding: 10px 18px; max-height: calc(100vh - 16px); overflow-y: auto; touch-action: pan-y; }
    #intro h1 { font-size: 34px; }
    #intro p { font-size: 15px; margin: 4px 0 8px; }
    .keys { font-size: 13px; margin-bottom: 8px; }
    #start { font-size: 20px; padding: 5px 26px; }
    #quality { margin-top: 6px; font-size: 13px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="tl" class="patch">
    <div id="clock">10:00</div>
    <div id="times">
      <button data-h="6">Dawn</button><button data-h="9">Morning</button><button data-h="12.5">Noon</button>
      <button data-h="17">Golden</button><button data-h="19.3">Dusk</button><button data-h="23">Night</button>
      <button id="tpause">Pause</button>
    </div>
  </div>
  <div id="tr" class="patch">
    <div>Buttons <b id="cButtons">0</b></div>
    <div>Pearls <b id="cPearls">0</b></div>
    <div>Phrases <b id="cPhrases">0</b></div>
    <div id="region" style="font-size:15px;color:#6d5a50">Meadow</div>
  </div>
  <div id="bl" class="patch">
    <div id="mode">CAR</div>
    <div id="speed">0 <small>km/h</small></div>
    <div id="radio">Wool FM</div>
    <button id="bMusic" class="btn" style="margin-top:6px">Music: on</button>
    <div id="hint">H help</div>
  </div>
  <div id="mm" class="patch"><canvas id="minimap" width="170" height="170"></canvas></div>
  <div id="help" class="patch">
    <div class="keys" id="helpKeys"></div>
    <div style="text-align:center">Press H to close</div>
  </div>
  <div id="toast"></div>
</div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="tbtns">
    <button data-code="Space" id="bSpace">HOP</button>
    <button data-code="KeyQ" id="bQ">DIVE</button>
    <button data-code="ShiftLeft" id="bShift">BOOST</button>
    <button data-code="KeyE" id="bE">GET OUT</button>
    <button data-code="KeyF" id="bF">BIRD</button>
    <button data-code="KeyT" id="bT">TURTLE</button>
    <button data-code="KeyC" id="bC">CAMERA</button>
  </div>
</div>
<div id="rotate">Turn your phone sideways to play Felt World.</div>

<div id="intro">
  <div class="patch">
    <h1>Felt World</h1>
    <p>A stitched wool country with a deep felt sea. Collect the buttons on the roads and the pearls on the reefs. Each full phrase plays a tune.</p>
    <div class="keys" id="introKeys"></div>
    <button id="start">Start</button>
    <div id="quality">Quality:
      <button class="btn" data-q="0">Low</button> <button class="btn" data-q="1">Medium</button> <button class="btn" data-q="2">High</button>
      <span id="qName"></span>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { SimplexNoise } from 'three/addons/math/SimplexNoise.js';

// ============================================================ constants
const SEED = 20260926;
const CH = 384;             // chunk size
const CELLS = 64;           // terrain cells per chunk side
const WATER_Y = 0;
const G1 = 480;             // primary road spacing
const G2 = 160;             // town street spacing
const HALF = 7;             // primary road half width
const HALF2 = 5;            // town street half width

const QP = [
  { name: 'Low',    pr: 0.75, radius: 1, lite: 2, shadow: 0,    traffic: 40, peds: 30, fish: 8,  sheep: 12, fogFar: 700 },
  { name: 'Medium', pr: 1.0,  radius: 1, lite: 2, shadow: 1024, traffic: 70, peds: 50, fish: 12, sheep: 20, fogFar: 900 },
  { name: 'High',   pr: 1.5,  radius: 2, lite: 3, shadow: 2048, traffic: 110, peds: 80, fish: 16, sheep: 30, fogFar: 1150 },
];
// touch: coarse pointer, or ?touch / ?desktop to force either way
const URLQ = new URLSearchParams(location.search);
const TOUCH = URLQ.has('touch') || (!URLQ.has('desktop') && matchMedia('(pointer: coarse)').matches);
if (TOUCH) document.body.classList.add('touch');
let QI = TOUCH ? 0 : 1;  // phones start on Low
try { const s = localStorage.getItem('feltworld.q'); if (s !== null) QI = Math.max(0, Math.min(2, +s)); } catch (e) {}
let Q = QP[QI];
if (TOUCH) Q = { ...Q, pr: Math.max(Q.pr, 1) };  // small screens: keep 1x as the ceiling; autoRes still drops below it

// ============================================================ random + noise
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(z | 0, 668265263) ^ SEED;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}
// world randomness: swapped per chunk so a chunk is identical every time it is built
let rand = mulberry32(SEED);
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[(rand() * arr.length) | 0];

const SN = new SimplexNoise({ random: mulberry32(SEED) });
const n2 = (x, z) => SN.noise(x, z);
function fbm(x, z, oct) {
  let a = 0.5, f = 1, s = 0;
  for (let i = 0; i < oct; i++) { s += a * n2(x * f, z * f); f *= 2.03; a *= 0.5; }
  return s;
}
function ridge(x, z) {
  let a = 0.5, f = 1, s = 0;
  for (let i = 0; i < 4; i++) { const v = 1 - Math.abs(n2(x * f + 7.1, z * f - 3.3)); s += a * v * v; f *= 2.1; a *= 0.5; }
  return s;
}
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

// ============================================================ world: pure functions of (x, z)
// biome masks. oceanM comes first; every land mask is multiplied by (1 - ocean).
const _m = { ocean: 0, mtn: 0, town: 0, forest: 0, field: 0, meadow: 0 };
function masks(x, z, o = _m) {
  const wx = x + 170 * n2(x * 0.0004 + 3.1, z * 0.0004 - 7.7);
  const wz = z + 170 * n2(x * 0.0004 - 5.2, z * 0.0004 + 1.3);
  const oc = smooth(0.12, 0.55, 0.8 * n2(wx * 0.00055 + 11.3, wz * 0.00055 - 4.1) + 0.2 * n2(wx * 0.0021, wz * 0.0021));
  const land = 1 - oc;
  const mtn = smooth(0.38, 0.78, n2(wx * 0.0008 + 50, wz * 0.0008 + 20)) * land;
  const town = smooth(0.25, 0.55, n2(wx * 0.0011 - 30, wz * 0.0011 + 70)) * land * (1 - mtn);
  const forest = smooth(0.05, 0.45, n2(wx * 0.0015 + 90, wz * 0.0015 - 60)) * land * (1 - mtn) * (1 - town);
  const field = smooth(-0.2, 0.2, n2(wx * 0.0013 - 120, wz * 0.0013 + 40)) * land * (1 - mtn) * (1 - town) * (1 - forest);
  o.ocean = oc; o.mtn = mtn; o.town = town; o.forest = forest; o.field = field;
  o.meadow = Math.max(0, land - mtn - town - forest - field);
  return o;
}

// smooth large-scale height (roads sit on this)
function lowH(x, z, m) {
  const land = 9 + 9 * fbm(x * 0.0016, z * 0.0016, 3);
  const seabed = -(85 + 60 * (n2(x * 0.002 + 40, z * 0.002 - 40) * 0.5 + 0.5));
  const dip = Math.pow(m.ocean, 1.5);
  return lerp(land, seabed, dip);
}
// detail that the roads flatten away
function detailH(x, z, m) {
  let d = 2.2 * fbm(x * 0.012, z * 0.012, 2);
  if (m.mtn > 0.001) d += Math.pow(m.mtn, 1.5) * 135 * ridge(x * 0.0025, z * 0.0025);
  if (m.ocean > 0.3) d += (m.ocean - 0.3) * 14 * fbm(x * 0.01 + 9, z * 0.01, 2);
  return d;
}

// ---- analytic warped road grid. fam 0/1 = primary (along x / along z), fam 2/3 = town streets
function roadWarp(fam, k, s) {
  if (fam < 2) return 70 * Math.sin(s * 0.0035 + k * 1.7 + fam * 4.1) + 28 * Math.sin(s * 0.0091 + k * 2.9 + fam);
  return 10 * Math.sin(s * 0.019 + k * 1.3 + fam);
}
function roadWarpD(fam, k, s) {
  if (fam < 2) return 70 * 0.0035 * Math.cos(s * 0.0035 + k * 1.7 + fam * 4.1) + 28 * 0.0091 * Math.cos(s * 0.0091 + k * 2.9 + fam);
  return 10 * 0.019 * Math.cos(s * 0.019 + k * 1.3 + fam);
}
const famG = (fam) => fam < 2 ? G1 : G2;
const famOff = (fam) => fam < 2 ? 0 : G2 * 0.5;
const famHalf = (fam) => fam < 2 ? HALF : HALF2;
// how much a road exists at this point (0..1), continuous so terrain flattening has no seams
function roadAct(fam, m) {
  const a = (1 - smooth(0.02, 0.06, m.ocean)) * (1 - smooth(0.16, 0.24, m.mtn));
  return fam < 2 ? a : a * smooth(0.38, 0.48, m.town);
}
const _rm = { ocean: 0, mtn: 0, town: 0, forest: 0, field: 0, meadow: 0 };
const R = { d: 1e9, fam: -1, k: 0, s: 0, side: 0, flat: 0, half: HALF };
// nearest active road to (x, z). Returns R (shared) or null. R.flat is the terrain flatten weight.
function roadNear(x, z, m) {
  R.d = 1e9; R.fam = -1; R.flat = 0;
  for (let fam = 0; fam < 4; fam++) {
    const s = (fam & 1) ? z : x, q = (fam & 1) ? x : z;
    const g = famG(fam), off = famOff(fam), half = famHalf(fam);
    const k0 = Math.round((q - off) / g);
    for (let k = k0 - 1; k <= k0 + 1; k++) {
      const c = k * g + off + roadWarp(fam, k, s);
      const dq = q - c;
      const wd = roadWarpD(fam, k, s);
      const d = Math.abs(dq) / Math.sqrt(1 + wd * wd);
      if (d > half + 45) continue;
      // activity at the road's centre line (as buildRoads uses), not at (x, z): a mountain mask
      // that rises across the road must not leave one edge of a drawn road unflattened
      const act = roadAct(fam, (fam & 1) ? masks(c, s, _rm) : masks(s, c, _rm));
      if (act <= 0) continue;
      // a drawn road (act > 0.5) flattens the ground under it fully, so no deck floats above a hillside
      const fl = Math.min(1, act * 2) * (1 - smooth(half + 1, half + 45, d));
      if (fl > R.flat) R.flat = fl;
      if (act > 0.5 && d < R.d) { R.d = d; R.fam = fam; R.k = k; R.s = s; R.side = Math.sign(dq); R.half = half; }
    }
  }
  return R.fam >= 0 ? R : null;
}
// point on a road centre line + unit tangent
const RC = { x: 0, z: 0, tx: 1, tz: 0 };
function roadCenter(fam, k, s, o = RC) {
  const c = k * famG(fam) + famOff(fam) + roadWarp(fam, k, s);
  const w = roadWarpD(fam, k, s), l = Math.sqrt(1 + w * w);
  if (fam & 1) { o.x = c; o.z = s; o.tx = w / l; o.tz = 1 / l; }
  else { o.x = s; o.z = c; o.tx = 1 / l; o.tz = w / l; }
  return o;
}
function heightAt(x, z) {
  const m = masks(x, z);
  const r = roadNear(x, z, m);
  const fl = r ? r.flat : R.flat;
  return lowH(x, z, m) + detailH(x, z, m) * (1 - fl);
}
function onRoad(x, z) {
  const r = roadNear(x, z, masks(x, z));
  return r && r.d < r.half + 0.5;
}
function regionName(x, z) {
  const m = masks(x, z), h = heightAt(x, z);
  if (h < WATER_Y - 30) return 'Deep Felt Sea';
  if (h < WATER_Y) return 'Shallows';
  if (h < 3) return 'Oatmeal Beach';
  let best = 'Meadow', v = m.meadow;
  if (m.mtn > v) { best = 'Knitted Hills'; v = m.mtn; }
  if (m.town > v) { best = 'Buttonbury'; v = m.town; }
  if (m.forest > v) { best = 'Pom-pom Wood'; v = m.forest; }
  if (m.field > v) { best = 'Patchwork Fields'; v = m.field; }
  return best;
}

// spawn: a primary crossroads in a town, dry, with sea within ~1 km
function findSpawn() {
  let best = null, bestScore = -1e9;
  for (let i = -6; i <= 6; i++) for (let j = -6; j <= 6; j++) {
    const x = i * G1 + roadWarp(1, i, j * G1), z = j * G1 + roadWarp(0, j, x);
    const m = masks(x, z);
    if (m.ocean > 0.01 || m.mtn > 0.1) continue;
    let sea = 1e9;
    for (let a = 0; a < 16; a++) for (let r = 200; r <= 1400; r += 200) {
      const px = x + Math.cos(a / 16 * Math.PI * 2) * r, pz = z + Math.sin(a / 16 * Math.PI * 2) * r;
      if (heightAt(px, pz) < -20) { sea = Math.min(sea, r); break; }
    }
    const score = m.town * 3 + (sea < 1e9 ? 2 - sea / 1400 : -5) - Math.hypot(x, z) / 4000;
    if (score > bestScore) { bestScore = score; best = { x, z }; }
  }
  return best || { x: 0, z: 0 };
}

// ============================================================ palette
const PAL = {
  oat: 0xd9c9a8, mustard: 0xd4a636, sage: 0x9caf88, rose: 0xd49a9a, teal: 0x3f8f8c, terra: 0xc46a4a,
  cream: 0xf1e6cf, plum: 0x8a6a8f, denim: 0x5b7fa6, moss: 0x6f8a55, brown: 0x7a5a44, charcoal: 0x4a4040,
  coral: 0xe57b6a, lilac: 0xb39ccf, rust: 0xb0603a, forest: 0x5f7f4f, sand: 0xdcc79c, snow: 0xf4ecdc,
  thread: 0x5a3e36, pink: 0xe8a0b0, sky: 0x9cc7d0,
};
const HOUSE_COLS = [PAL.rose, PAL.cream, PAL.mustard, PAL.terra, PAL.teal, PAL.sage, PAL.lilac, PAL.oat];
const TREE_COLS = [PAL.sage, PAL.moss, PAL.forest, PAL.teal, PAL.mustard, 0x8fa66a, PAL.rust];
const CORAL_COLS = [PAL.coral, PAL.terra, PAL.mustard, PAL.lilac, PAL.pink, PAL.rose, 0xf0b060];
const _c = new THREE.Color();

// ============================================================ renderer, scene, camera
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, Q.pr);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = Q.shadow > 0;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

function canvasTex(w, h, draw, repeat = true) {

}

  g.fillStyle = '#e9e4dc'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5200; i++) {
    const x = texRand() * w, y = texRand() * h, a = texRand() * Math.PI * 2, l = 2 + texRand() * 7;
    const v = texRand() < 0.5 ? 255 : 170 + texRand() * 40;
    g.strokeStyle = `rgba(${v},${v - 4},${v - 10},${0.18 + texRand() * 0.25})`;
    g.lineWidth = 0.6 + texRand() * 0.8;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 1) * l * 0.5, y + Math.sin(a + 1) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
});

function knitRoadTex(base, stitch, edge, dash) {
  return canvasTex(128, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const cols = 8, rows = 16, cw = w / cols, rh = h / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const x = c * cw, y = r * rh;
      g.strokeStyle = stitch; g.lineWidth = 3.2; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x + 2, y + 2); g.lineTo(x + cw / 2, y + rh - 2); g.lineTo(x + cw - 2, y + 2); g.stroke();
      g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x + cw / 2, y + rh - 1); g.lineTo(x + cw / 2, y + rh + 1); g.stroke();
    }
    g.fillStyle = edge; g.fillRect(0, 0, 10, h); g.fillRect(w - 10, 0, 10, h);
    g.strokeStyle = dash; g.lineWidth = 5; g.setLineDash([22, 14]); g.lineCap = 'round';
    g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.stroke();
    g.setLineDash([8, 7]); g.lineWidth = 2; g.strokeStyle = '#efe3c8';
    g.beginPath(); g.moveTo(14, 0); g.lineTo(14, h); g.moveTo(w - 14, 0); g.lineTo(w - 14, h); g.stroke();

}

    float th(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

      if (i < 1.0) return vec3(0.83,0.64,0.21);

function makeOutline(dash, color = PAL.thread) {
  const m = new THREE.MeshBasicMaterial({ color, side: THREE.BackSide });
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = 'varying vec3 vOW;\n' + sh.vertexShader.replace('#include <project_vertex>', `

      float _d = length(cameraPosition - _w.xyz);
      _w.xyz += _wn * (0.05 + _d * 0.0021);
      vOW = _w.xyz;
      vec4 mvPosition = viewMatrix * _w;

const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _v = new THREE.Vector3(), _s3 = new THREE.Vector3(), _mat = new THREE.Matrix4();
class Batch {
  constructor() { this.lists = new Map(); }
  // geo, kind, position, scale, rotation (y, x, z), colour, outline, small (hidden at mid range)
  add(geo, kind, x, y, z, sx, sy, sz, ry, rx, rz, col, outline = true, small = false) {
    const key = geo + '|' + kind + '|' + (outline ? 1 : 0) + '|' + (small ? 1 : 0);
    let L = this.lists.get(key);
    if (!L) { L = { geo, kind, outline, small, m: [], c: [] }; this.lists.set(key, L); }
    _e.set(rx || 0, ry || 0, rz || 0, 'YXZ'); _q.setFromEuler(_e);

    for (let i = 0; i < 16; i++) L.m.push(_mat.elements[i]);
    _c.set(col); L.c.push(_c.r, _c.g, _c.b);
  }
  flush(group, chunk) {
    for (const L of this.lists.values()) {
      const n = L.c.length / 3;
      const mesh = new THREE.InstancedMesh(GEO[L.geo], MATS[L.kind], n);
      mesh.instanceMatrix.array.set(L.m);
      mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(L.c), 3);
      mesh.computeBoundingSphere();
      const shadow = L.kind === 'felt' || L.kind === 'kelp';
      mesh.castShadow = shadow && !L.small; mesh.receiveShadow = shadow;
      group.add(mesh);
      if (L.small) chunk.smalls.push(mesh);
      if (L.outline) {
        const ol = new THREE.InstancedMesh(GEO[L.geo], OL_DASH, n);
        ol.instanceMatrix = mesh.instanceMatrix;
        ol.boundingSphere = mesh.boundingSphere;
        group.add(ol);
        chunk.outlines.push(ol);
        if (L.small) chunk.smalls.push(ol);
      }
    }
    this.lists.clear();
  }
}

    uTime: U.uTime, uUnder: U.uUnder, uFade: { value: 1 }, near: { value: camera.near }, far: { value: camera.far },
    dpr: { value: 1 }, uSpeed: { value: 0 },

  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `uniform sampler2D tColor, tDepth; uniform vec2 res; uniform float uTime, uUnder, uFade, near, far, dpr, uSpeed;
    varying vec2 vUv;
    float hh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);

      j += (vec2(hh(floor(q * 0.5)), hh(floor(q * 0.5) + 7.3)) - 0.5) * 0.6;

      vec3 b = (tex(uvj + vec2(o.x, 0.0)) + tex(uvj - vec2(o.x, 0.0)) + tex(uvj + vec2(0.0, o.y)) + tex(uvj - vec2(0.0, o.y))) * 0.25;

      float d3 = lin(texture2D(tDepth, vUv + vec2(0.0, e1.y)).r), d4 = lin(texture2D(tDepth, vUv - vec2(0.0, e1.y)).r);

    VEH.speed = 0;
    setMode('walk'); toast('On foot');
    return;
  }
  if (G.mode !== 'walk') return;
  const p = WALK.pos;
  if (!VEH.hidden && Math.hypot(VEH.pos.x - p.x, VEH.pos.z - p.z) < 6.5) { setMode('drive'); toast(VEH.form === 'sub' ? 'Submarine' : 'Car'); return; }

  const g = groundAt(v.pos.x, v.pos.z);
  v.swim = g < WATER_Y - 1.4 && v.pos.y < WATER_Y;
  const maxSp = v.swim ? 4 : run ? 14 : 7;
  v.speed = lerp(v.speed, f * maxSp, 1 - Math.exp(-8 * dt));
  v.heading += t * dt * 2.6;
  const dx = Math.sin(v.heading), dz = Math.cos(v.heading);
  v.pos.x += dx * v.speed * dt; v.pos.z += dz * v.speed * dt;
  collide(v.pos, 0.5);
  const g2 = groundAt(v.pos.x, v.pos.z);
  if (v.swim) {
    if (held('KeyQ')) { diveToTurtle(v.pos, v.heading, WATER_Y - 1.5); return; } // Q dives under
    v.pos.y = lerp(v.pos.y, WATER_Y - 1.0, 1 - Math.exp(-4 * dt)); v.vy = 0;
  } else {

  }

  const m = walkerModel;

function collect(n) {

// ============================================================ HUD: clock, speed, mode, region, minimap
const mm = $('minimap'), mmx = mm.getContext('2d');
const MM_N = 56, MM_R = 420;
const mmImg = mmx.createImageData(MM_N, MM_N);
const mmOff = document.createElement('canvas'); mmOff.width = mmOff.height = MM_N;
const mmOffX = mmOff.getContext('2d');
let mmRow = 0, mmCx = 0, mmCz = 0, mmNextCx = 0, mmNextCz = 0, hudT = 0;
function mmColor(x, z) {
  const h = heightAt(x, z);
  if (h < WATER_Y) { const d = clamp(-h / 120, 0, 1); return [lerp(96, 40, d), lerp(160, 90, d), lerp(170, 120, d)]; }
  const m = masks(x, z, _mm);
  const r = roadNear(x, z, m);
  if (r && r.d < r.half + 3) return r.fam < 2 ? [110, 112, 125] : [180, 140, 134];
  if (h < 2.8 && m.ocean > 0.004) return [220, 200, 156];
  if (m.town > 0.45) return [214, 190, 160];
  if (m.mtn > 0.35) return h > 80 ? [240, 234, 220] : [160, 144, 146];
  if (m.forest > 0.4) return [110, 140, 90];
  if (m.field > 0.4) { const k = hash2(Math.floor(x / 36), Math.floor(z / 36)) % 4; return [[212, 166, 54], [156, 175, 136], [196, 106, 74], [214, 154, 154]][k]; }
  return [167, 184, 127];
}
function updateMinimapRows(n) {
  const step = MM_R * 2 / MM_N;
  for (let k = 0; k < n; k++) {
    if (mmRow === 0) { mmNextCx = activeEnt().pos.x; mmNextCz = activeEnt().pos.z; }
    const z = mmNextCz - MM_R + (mmRow + 0.5) * step;
    for (let i = 0; i < MM_N; i++) {
      const c = mmColor(mmNextCx - MM_R + (i + 0.5) * step, z), o = (mmRow * MM_N + i) * 4;
      mmImg.data[o] = c[0]; mmImg.data[o + 1] = c[1]; mmImg.data[o + 2] = c[2]; mmImg.data[o + 3] = 255;
    }
    mmRow++;
    if (mmRow >= MM_N) { mmRow = 0; mmOffX.putImageData(mmImg, 0, 0); mmCx = mmNextCx; mmCz = mmNextCz; }
  }
}
for (let i = 0; i < MM_N; i++) updateMinimapRows(1);
function drawMinimap() {
  const W = mm.width, e = activeEnt(), sc = W / (MM_R * 2);
  mmx.save();
  mmx.fillStyle = '#6fa0a8'; mmx.fillRect(0, 0, W, W);
  mmx.imageSmoothingEnabled = true;
  mmx.drawImage(mmOff, (mmCx - e.pos.x) * sc, (mmCz - e.pos.z) * sc, W, W);
  for (const n of notes.values()) {
    const x = W / 2 + (n.x - e.pos.x) * sc, y = W / 2 + (n.z - e.pos.z) * sc;
    if (x < 0 || y < 0 || x > W || y > W) continue;
    mmx.fillStyle = n.kind === 'pearl' ? '#fff6ea' : '#e57b6a'; mmx.fillRect(x - 1.5, y - 1.5, 3, 3);
  }
  if (G.mode !== 'drive' && !VEH.hidden) {
    const x = W / 2 + (VEH.pos.x - e.pos.x) * sc, y = W / 2 + (VEH.pos.z - e.pos.z) * sc;
    mmx.fillStyle = '#d4a636'; mmx.strokeStyle = '#5a3e36'; mmx.lineWidth = 1.5; mmx.fillRect(x - 3, y - 3, 6, 6); mmx.strokeRect(x - 3, y - 3, 6, 6);
  }
  // player arrow (north up; +z is down on the map)
  mmx.translate(W / 2, W / 2); mmx.rotate(-e.heading);
  mmx.fillStyle = '#c46a4a'; mmx.strokeStyle = '#f1e6cf'; mmx.lineWidth = 2;
  mmx.beginPath(); mmx.moveTo(0, 8); mmx.lineTo(-5, -5); mmx.lineTo(5, -5); mmx.closePath(); mmx.fill(); mmx.stroke();
  mmx.restore();
  mmx.strokeStyle = '#5a3e36'; mmx.setLineDash([5, 4]); mmx.lineWidth = 2;
  mmx.beginPath(); mmx.arc(W / 2, W / 2, W / 2 - 4, 0, Math.PI * 2); mmx.stroke(); mmx.setLineDash([]);
}
const MODE_INFO = {
  car: ['CAR', 'Space hop - E get out - F fly'],
  sub: ['SUBMARINE', 'Space rise - Q dive - T turtle'],
  walk: ['ON FOOT', 'Shift run - E get in - F fly'],
  swim: ['SWIMMING', 'T turn into a turtle'],
  turtle: ['SEA TURTLE', 'Space rise - Q dive - T change back'],
  bird: ['FELT BIRD', 'W dive - S climb - Space flap - F land'],
};
function hudUpdate(dt) {
  updateMinimapRows(2);
  if (!G.started) return;
  hudT -= dt;
  drawMinimap();
  const e = activeEnt();
  const key = G.mode === 'drive' ? VEH.form : G.mode === 'walk' ? (WALK.swim ? 'swim' : 'walk') : G.mode;
  const sp = Math.abs(e.speed || 0) * 3.6 | 0;
  // in the sea: show your depth and the sea-floor depth (whales need a floor deeper than 40 m)
  const floor = WATER_Y - heightAt(e.pos.x, e.pos.z);
  const sea = floor > 0 && e.pos.y < WATER_Y + 1 ? ` <small>· depth ${Math.max(0, WATER_Y - e.pos.y) | 0} m · floor ${floor | 0} m</small>` : '';
  $('speed').innerHTML = sp + ' <small>km/h</small>' + sea;

    let best = null, bd = 1e9;
    for (const b of document.querySelectorAll('#times button[data-h]')) { const d = Math.abs(((G.hour - +b.dataset.h + 36) % 24) - 12); b.classList.remove('on'); if (d < bd) { bd = d; best = b; } }
    if (best && bd < 1.5) best.classList.add('on');

updaters.push(hudUpdate);

// ============================================================ touch controls (phones): joystick, buttons, look-drag, pinch zoom
if (TOUCH) {
  const capture = (el, id) => { try { el.setPointerCapture(id); } catch (e) {} };
  // joystick
  const stick = $('stick'), knob = $('knob');
  let sid = null;
  const moveStick = (e) => {
    const r = stick.getBoundingClientRect(), R = r.width / 2;
    let dx = (e.clientX - r.left - R) / R, dy = (e.clientY - r.top - R) / R;
    const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
    knob.style.transform = `translate(${dx * R * 0.6}px, ${dy * R * 0.6}px)`;
    const dead = (v) => Math.abs(v) < 0.15 ? 0 : (v - Math.sign(v) * 0.15) / 0.85;

  };

  for (const b of document.querySelectorAll('#tbtns button')) {
    const code = b.dataset.code;
    const up = () => { keys[code] = false; b.classList.remove('down'); };
    b.addEventListener('pointerdown', (e) => {
      e.preventDefault(); capture(b, e.pointerId);
      if (!G.started) return;
      if (!keys[code] && ACTIONS[code]) ACTIONS[code]();
      keys[code] = true; tapped[code] = true; b.classList.add('down');
    });
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up);
  }
  // drag on the empty screen = look; two fingers = pinch zoom
  const pts = new Map();
  let pinch0 = 0, zoom0 = 1;
  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') return;
    e.preventDefault(); capture(canvas, e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = CAM.zoom; }
  });
  canvas.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId); if (!p) return;

      CAM.yaw -= (e.clientX - p.x) * 0.008; CAM.pitch = clamp(CAM.pitch + (e.clientY - p.y) * 0.005, -0.5, 1.1); CAM.idle = 0;
    }
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 2 && pinch0 > 0) { const [a, b] = [...pts.values()]; CAM.zoom = clamp(zoom0 * pinch0 / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), 0.45, 3); }
  });

  const HOURS = [6, 9, 12.5, 17, 19.3, 23];
  $('clock').addEventListener('click', () => { G.hour = HOURS.find((h) => h > G.hour + 0.05) ?? HOURS[0]; });
  $('bl').addEventListener('click', () => ACTIONS.KeyH());
  $('help').addEventListener('click', () => ACTIONS.KeyH());
  // show only the buttons that do something in this mode
  const bt = { Space: $('bSpace'), Q: $('bQ'), Shift: $('bShift'), E: $('bE'), F: $('bF'), T: $('bT') };
  let tbT = 0;
  updaters.push((dt) => {
    tbT -= dt; if (tbT > 0 || !G.started) return; tbT = 0.25;
    const e = activeEnt(), gy = heightAt(e.pos.x, e.pos.z);
    const car = G.mode === 'drive' && VEH.form === 'car', sub = G.mode === 'drive' && VEH.form === 'sub';

    set(bt.Q, sub || turtle || (walk && WALK.swim), 'DIVE');

    const near = walk && ((!VEH.hidden && Math.hypot(VEH.pos.x - e.pos.x, VEH.pos.z - e.pos.z) < 6.5) || traffic.some((a) => !a.hidden && Math.hypot(a.x - e.pos.x, a.z - e.pos.z) < 7));
